name: Release models

# Pushing a tag (e.g. v1.0.0) publishes the models of that commit as a GitHub release.
# CLLG Desktop downloads them from there on first run, and its own release workflow
# copies them into every app release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          lfs: true

      # An LFS pointer instead of the real file (LFS quota exceeded, missing object…)
      # fails here rather than being published.
      - name: Check the models against SHA256SUMS
        working-directory: models
        run: sha256sum --check --strict ../SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            models/*.js_mlmodel
            SHA256SUMS
          generate_release_notes: true
